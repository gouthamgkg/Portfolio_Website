<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .star-twinkle { animation: starPulse 2.6s infinite ease-in-out; transform-origin: center; transform-box: fill-box; }
    .star-delay-1 { animation-delay: 0.9s; }
    .card-float { animation: floatTask 4s ease-in-out infinite alternate; }
    .timer-spin { animation: spinHand 8s linear infinite; transform-origin: 470px 240px; }
    @keyframes starPulse { 0%, 100% { opacity: 0.3; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes floatTask { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
    @keyframes spinHand { to { transform: rotate(360deg); } }
  </style>

  <!-- Deep Backdrop -->
  <rect width="600" height="380" rx="16" fill="#0d1117"/>
  <circle cx="300" cy="190" r="185" fill="url(#ticket_ambient)" opacity="0.45"/>

  <!-- Floor Grid -->
  <g opacity="0.2" stroke="#f59e0b" stroke-width="1">
    <line x1="80" y1="315" x2="520" y2="315"/>
    <line x1="120" y1="335" x2="480" y2="335"/>
    <line x1="160" y1="355" x2="440" y2="355"/>
    <line x1="110" y1="325" x2="220" y2="285"/>
    <line x1="490" y1="325" x2="380" y2="285"/>
  </g>

  <!-- Ambient Twinkling Vector Stars -->
  <path class="star-twinkle" d="M110 75 L112 80 L117 81.5 L112 83 L110 88 L108 83 L103 81.5 L108 80 Z" fill="#fbbf24"/>
  <path class="star-twinkle star-delay-1" d="M495 85 L496.5 90 L501 91.5 L496.5 93 L495 98 L493.5 93 L489 91.5 L493.5 90 Z" fill="#f97316"/>
  <circle cx="95" cy="200" r="2.5" fill="#fcd34d" opacity="0.7"/>
  <circle cx="515" cy="180" r="2" fill="#a5b4fc" opacity="0.6"/>

  <!-- Central Kanban Board Interface Window -->
  <rect x="125" y="65" width="350" height="225" rx="14" fill="#161b22" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
  <rect x="125" y="65" width="350" height="30" rx="14" fill="#21262d"/>
  <circle cx="147" cy="80" r="4" fill="#ef4444"/>
  <circle cx="161" cy="80" r="4" fill="#f59e0b"/>
  <circle cx="175" cy="80" r="4" fill="#10b981"/>
  <text x="198" y="84" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">SPRINT_WORK_TICKETING.BOARD</text>

  <!-- Kanban Column 1: TO DO -->
  <g transform="translate(145, 110)">
    <rect width="90" height="160" rx="8" fill="#0d1117" opacity="0.75" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="18" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">TO DO [3]</text>
    
    <!-- Task Item 1 -->
    <rect x="8" y="28" width="74" height="38" rx="6" fill="#21262d" stroke="#f59e0b" stroke-width="1"/>
    <rect x="14" y="36" width="38" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="14" y="44" width="56" height="3" rx="1.5" fill="#94a3b8"/>
    <rect x="14" y="52" width="22" height="7" rx="3.5" fill="#dc2626"/>
    <text x="17" y="58" fill="#ffffff" font-family="sans-serif" font-size="6" font-weight="700">P1 SLA</text>

    <!-- Task Item 2 -->
    <rect x="8" y="74" width="74" height="34" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="14" y="82" width="46" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="14" y="90" width="34" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Kanban Column 2: IN PROGRESS -->
  <g transform="translate(255, 110)">
    <rect width="90" height="160" rx="8" fill="#0d1117" opacity="0.75" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ACTIVE [2]</text>

    <!-- Active In-Progress Task Card -->
    <rect x="8" y="28" width="74" height="44" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="14" y="36" width="48" height="4" rx="2" fill="#ffffff"/>
    <rect x="14" y="44" width="58" height="3" rx="1.5" fill="#94a3b8"/>
    <rect x="14" y="54" width="30" height="7" rx="3.5" fill="#0284c7"/>
    <text x="17" y="60" fill="#ffffff" font-family="sans-serif" font-size="6" font-weight="700">DEV REVIEW</text>

    <rect x="8" y="80" width="74" height="34" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="14" y="88" width="38" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="14" y="96" width="48" height="3" rx="1.5" fill="#94a3b8"/>
  </g>

  <!-- Kanban Column 3: RESOLVED -->
  <g transform="translate(365, 110)">
    <rect width="90" height="160" rx="8" fill="#0d1117" opacity="0.75" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="18" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RESOLVED</text>

    <!-- Completed Task 1 -->
    <rect x="8" y="28" width="74" height="38" rx="6" fill="#13231b" stroke="#10b981" stroke-width="1"/>
    <circle cx="18" cy="40" r="5" fill="#10b981"/>
    <path d="M16 40 L18 42 L21 38" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="28" y="38" width="42" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <rect x="14" y="50" width="50" height="3" rx="1.5" fill="#6ee7b7" opacity="0.8"/>

    <!-- Completed Task 2 -->
    <rect x="8" y="74" width="74" height="36" rx="6" fill="#13231b" stroke="#10b981" stroke-width="1"/>
    <circle cx="18" cy="86" r="5" fill="#10b981"/>
    <path d="M16 86 L18 88 L21 84" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="28" y="84" width="36" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
  </g>


  <!-- Floating SLA Stopwatch Meter (Right) -->
  <g transform="translate(425, 205)">
    <circle cx="45" cy="35" r="32" fill="#1e1b4b" stroke="#f97316" stroke-width="3" filter="drop-shadow(0 8px 18px rgba(0,0,0,0.6))"/>
    <!-- Stopwatch Button -->
    <rect x="42" y="-3" width="6" height="8" rx="2" fill="#f97316"/>
    <!-- Dial Marks -->
    <circle cx="45" cy="35" r="24" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <!-- Rotating Hand -->
    <line x1="45" y1="35" x2="45" y2="18" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" class="timer-spin" style="transform-origin: 45px 35px;"/>
    <circle cx="45" cy="35" r="4" fill="#ffffff"/>
    <!-- SLA 100% Tag -->
    <rect x="20" y="54" width="50" height="14" rx="7" fill="#10b981" stroke="#ffffff" stroke-width="1"/>
    <text x="26" y="64" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="800">SLA 100%</text>
  </g>

  <defs>
    <radialGradient id="ticket_ambient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ticket_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
</svg>
