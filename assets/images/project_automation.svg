<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .star-twinkle { animation: starPulse 2.4s infinite ease-in-out; transform-origin: center; transform-box: fill-box; }
    .star-delay-1 { animation-delay: 1.1s; }
    .data-flow-1 { animation: pulseDash 6s linear infinite; }
    .data-flow-2 { animation: pulseDash 8s linear infinite reverse; }
    .gear-spin { animation: spin 16s linear infinite; transform-origin: 300px 185px; }
    @keyframes starPulse { 0%, 100% { opacity: 0.3; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes pulseDash { to { stroke-dashoffset: -100; } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Deep Backdrop -->
  <rect width="600" height="380" rx="16" fill="#06121e"/>
  <circle cx="300" cy="190" r="185" fill="url(#api_ambient)" opacity="0.45"/>

  <!-- Floor Grid -->
  <g opacity="0.2" stroke="#10b981" stroke-width="1">
    <line x1="80" y1="315" x2="520" y2="315"/>
    <line x1="120" y1="335" x2="480" y2="335"/>
    <line x1="160" y1="355" x2="440" y2="355"/>
    <line x1="100" y1="325" x2="220" y2="285"/>
    <line x1="500" y1="325" x2="380" y2="285"/>
  </g>

  <!-- Twinkling Vector Stars -->
  <path class="star-twinkle" d="M110 70 L112 75 L117 76.5 L112 78 L110 83 L108 78 L103 76.5 L108 75 Z" fill="#34d399"/>
  <path class="star-twinkle star-delay-1" d="M490 80 L491.5 85 L496 86.5 L491.5 88 L490 93 L488.5 88 L484 86.5 L488.5 85 Z" fill="#38bdf8"/>
  <circle cx="85" cy="210" r="2.5" fill="#6ee7b7" opacity="0.7"/>
  <circle cx="515" cy="220" r="2" fill="#818cf8" opacity="0.6"/>

  <!-- Central Cloud & API Gateway Window Frame -->
  <rect x="130" y="65" width="340" height="225" rx="14" fill="#0b1727" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
  <rect x="130" y="65" width="340" height="30" rx="14" fill="#132338"/>
  <circle cx="152" cy="80" r="4" fill="#ef4444"/>
  <circle cx="166" cy="80" r="4" fill="#f59e0b"/>
  <circle cx="180" cy="80" r="4" fill="#10b981"/>
  <text x="204" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">REST_API_PIPELINE.GATEWAY</text>

  <!-- Central Automation Hub Node -->
  <circle cx="300" cy="185" r="46" fill="#0f2b3e" stroke="#10b981" stroke-width="2"/>
  <circle cx="300" cy="185" r="32" fill="#133d52" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 4" class="data-flow-1"/>
  
  <!-- Central Gear Icon -->
  <g class="gear-spin">
    <path d="M296 158 H304 V166 H296 Z M296 204 H304 V212 H296 Z M273 181 H281 V189 H273 Z M319 181 H327 V189 H319 Z" fill="#34d399"/>
    <circle cx="300" cy="185" r="16" fill="#059669" stroke="#ffffff" stroke-width="2"/>
    <circle cx="300" cy="185" r="6" fill="#ffffff"/>
  </g>

  <!-- Left Side: Inbound Endpoints (Payment & SMS) -->
  <g transform="translate(155, 125)">
    <!-- Payment API Node -->
    <rect width="80" height="42" rx="8" fill="#112d42" stroke="#06b6d4" stroke-width="1.2"/>
    <circle cx="18" cy="21" r="9" fill="#0284c7" opacity="0.3"/>
    <path d="M14 21 H22 M18 17 V25" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <text x="32" y="18" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">PAYMENT</text>
    <text x="32" y="30" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7">POST /pay</text>

    <!-- SMS Notification Node -->
    <rect y="65" width="80" height="42" rx="8" fill="#112d42" stroke="#8b5cf6" stroke-width="1.2"/>
    <circle cx="18" cy="86" r="9" fill="#7c3aed" opacity="0.3"/>
    <path d="M14 83 H22 V89 H14 Z" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="32" y="83" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">SMS_GW</text>
    <text x="32" y="95" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="7">POST /sms</text>
  </g>

  <!-- Pipeline Conduits (Left to Center) -->
  <path d="M235 146 C 260 146, 260 175, 275 175" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="6 3" class="data-flow-1"/>
  <path d="M235 210 C 260 210, 260 195, 275 195" stroke="#a78bfa" stroke-width="2" fill="none" stroke-dasharray="6 3" class="data-flow-2"/>

  <!-- Right Side: Outbound Sync Targets (Database & Webhook) -->
  <g transform="translate(365, 125)">
    <!-- SQL Database Node -->
    <rect width="85" height="42" rx="8" fill="#112d42" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="18" cy="21" r="9" fill="#059669" opacity="0.3"/>
    <path d="M13 18 C13 16 23 16 23 18 C23 20 13 20 13 18 Z M13 18 V24 C13 26 23 26 23 24 V18" stroke="#34d399" stroke-width="1.5" fill="none"/>
    <text x="32" y="18" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">SQL_SYNC</text>
    <text x="32" y="30" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="7">200 OK</text>

    <!-- Background Schedulers Node -->
    <rect y="65" width="85" height="42" rx="8" fill="#112d42" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="18" cy="86" r="9" fill="#d97706" opacity="0.3"/>
    <circle cx="18" cy="86" r="5" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="32" y="83" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">CRON_JOB</text>
    <text x="32" y="95" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="7">RUNNING</text>
  </g>

  <!-- Pipeline Conduits (Center to Right) -->
  <path d="M325 175 C 340 175, 340 146, 365 146" stroke="#34d399" stroke-width="2" fill="none" stroke-dasharray="6 3" class="data-flow-1"/>
  <path d="M325 195 C 340 195, 340 210, 365 210" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="6 3" class="data-flow-2"/>

  <!-- Floating REST API Status Pill (Left) -->
  <g transform="translate(80, 220) rotate(-8)">
    <rect width="115" height="58" rx="10" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.6))"/>
    <circle cx="20" cy="29" r="6" fill="#10b981"/>
    <text x="34" y="24" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">API GATEWAY</text>
    <text x="34" y="38" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800">99.99% UPTIME</text>
    <rect x="34" y="44" width="60" height="3" rx="1.5" fill="#14b8a6"/>
  </g>

  <!-- Floating JSON Payload Badge (Right) -->
  <g transform="translate(415, 225) rotate(8)">
    <rect width="110" height="60" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.6))"/>
    <text x="14" y="20" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">{ "status": 200, </text>
    <text x="14" y="34" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="8">  "msg": "verified",</text>
    <text x="14" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8">  "sync": true }</text>
  </g>

  <defs>
    <radialGradient id="api_ambient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06121e" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
