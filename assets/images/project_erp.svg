<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .star-twinkle { animation: starPulse 2.8s infinite ease-in-out; transform-origin: center; transform-box: fill-box; }
    .star-delay-1 { animation-delay: 1s; }
    .star-delay-2 { animation-delay: 1.8s; }
    .scan-beam { animation: scanDown 3.5s ease-in-out infinite alternate; }
    .gear-rotate { animation: spinGear 24s linear infinite; transform-origin: 300px 190px; }
    @keyframes starPulse { 0%, 100% { opacity: 0.3; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes scanDown { 0% { transform: translateY(0); opacity: 0.2; } 50% { opacity: 0.85; } 100% { transform: translateY(120px); opacity: 0.2; } }
    @keyframes spinGear { to { transform: rotate(360deg); } }
  </style>

  <!-- Deep Backdrop -->
  <rect width="600" height="380" rx="16" fill="#0b0f19"/>
  <circle cx="300" cy="190" r="190" fill="url(#erp_ambient)" opacity="0.45"/>

  <!-- Floor Grid -->
  <g opacity="0.2" stroke="#818cf8" stroke-width="1">
    <line x1="80" y1="310" x2="520" y2="310"/>
    <line x1="120" y1="330" x2="480" y2="330"/>
    <line x1="160" y1="350" x2="440" y2="350"/>
    <line x1="100" y1="320" x2="220" y2="280"/>
    <line x1="500" y1="320" x2="380" y2="280"/>
  </g>

  <!-- Twinkling Vector Stars -->
  <path class="star-twinkle" d="M100 80 L102 85 L107 86.5 L102 88 L100 93 L98 88 L93 86.5 L98 85 Z" fill="#818cf8"/>
  <path class="star-twinkle star-delay-1" d="M490 70 L491.5 75 L496 76.5 L491.5 78 L490 83 L488.5 78 L484 76.5 L488.5 75 Z" fill="#c084fc"/>
  <path class="star-twinkle star-delay-2" d="M530 190 L531 194 L535 195 L531 196 L530 200 L529 196 L525 195 L529 194 Z" fill="#38bdf8"/>
  <circle cx="80" cy="220" r="2" fill="#c084fc" opacity="0.7"/>

  <!-- Central ERP Warehouse & Management Screen -->
  <rect x="130" y="70" width="340" height="220" rx="14" fill="#111827" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5"/>
  <rect x="130" y="70" width="340" height="30" rx="14" fill="#1f2937"/>
  <circle cx="152" cy="85" r="4" fill="#ef4444"/>
  <circle cx="166" cy="85" r="4" fill="#f59e0b"/>
  <circle cx="180" cy="85" r="4" fill="#10b981"/>
  <text x="204" y="89" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ENTERPRISE_ERP_HRMS.SYS</text>

  <!-- Left Side: HR Workforce Tree Diagram -->
  <g transform="translate(155, 120)">
    <!-- Root Node: HR Director -->
    <rect x="35" y="0" width="46" height="22" rx="6" fill="#4f46e5" stroke="#a5b4fc" stroke-width="1"/>
    <circle cx="45" cy="11" r="5" fill="#ffffff" opacity="0.8"/>
    <rect x="54" y="9" width="20" height="4" rx="2" fill="#ffffff"/>
    
    <!-- Connectors -->
    <path d="M58 22 L58 35 M24 35 L92 35 M24 35 L24 45 M92 35 L92 45" stroke="#6366f1" stroke-width="1.5" fill="none"/>
    
    <!-- Child Nodes: Engineering & Operations -->
    <rect x="2" y="45" width="44" height="20" rx="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <circle cx="10" cy="55" r="4" fill="#38bdf8"/>
    <rect x="18" y="53" width="22" height="3" rx="1.5" fill="#cbd5e1"/>

    <rect x="70" y="45" width="44" height="20" rx="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <circle cx="78" cy="55" r="4" fill="#34d399"/>
    <rect x="86" y="53" width="22" height="3" rx="1.5" fill="#cbd5e1"/>

    <!-- Attendance Meter Bar -->
    <text x="0" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">ATTENDANCE 99.4%</text>
    <rect x="0" y="98" width="116" height="5" rx="2.5" fill="#334155"/>
    <rect x="0" y="98" width="110" height="5" rx="2.5" fill="#10b981"/>
  </g>

  <!-- Right Side: Warehouse Inventory Storage Shelves -->
  <g transform="translate(315, 120)">
    <!-- Metal Rack Frame -->
    <rect x="0" y="0" width="135" height="110" rx="6" fill="#1e293b" opacity="0.6"/>
    <line x1="0" y1="40" x2="135" y2="40" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="78" x2="135" y2="78" stroke="#475569" stroke-width="2"/>
    
    <!-- Stock Storage Crates (Tier 1) -->
    <rect x="10" y="10" width="28" height="24" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="1"/>
    <line x1="10" y1="22" x2="38" y2="22" stroke="#d97706" stroke-width="1.5"/>
    <rect x="45" y="14" width="36" height="20" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <rect x="88" y="8" width="34" height="26" rx="4" fill="#7c3aed" stroke="#a78bfa" stroke-width="1"/>

    <!-- Stock Storage Crates (Tier 2) -->
    <rect x="10" y="48" width="34" height="24" rx="4" fill="#059669" stroke="#34d399" stroke-width="1"/>
    <rect x="52" y="52" width="32" height="20" rx="4" fill="#d97706" stroke="#fbbf24" stroke-width="1"/>
    <rect x="92" y="46" width="30" height="26" rx="4" fill="#2563eb" stroke="#60a5fa" stroke-width="1"/>

    <!-- Barcode Scanner Laser Line -->
    <line class="scan-beam" x1="5" y1="15" x2="130" y2="15" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2"/>
  </g>

  <!-- Foreground Pallet with Multi-Warehouse Box (Left) -->
  <g transform="translate(90, 220)">
    <!-- Wooden Pallet Base -->
    <rect x="0" y="48" width="90" height="12" rx="2" fill="#78350f" stroke="#b45309" stroke-width="1"/>
    <rect x="15" y="48" width="12" height="12" fill="#451a03"/>
    <rect x="63" y="48" width="12" height="12" fill="#451a03"/>
    <!-- Sealed Cargo Crate -->
    <rect x="10" y="10" width="70" height="38" rx="5" fill="url(#crate_grad)" stroke="#c084fc" stroke-width="1.5" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.5))"/>
    <path d="M10 10 L80 48 M80 10 L10 48" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <rect x="30" y="18" width="30" height="10" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="34" y="21" width="22" height="4" rx="1" fill="#1e1b4b"/>
  </g>

  <!-- Foreground Stock Sync Chip (Right) -->
  <g transform="translate(425, 230)">
    <rect width="95" height="58" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.6))"/>
    <circle cx="26" cy="29" r="14" fill="#38bdf8" opacity="0.2"/>
    <path d="M26 21 L26 37 M21 26 L26 21 L31 26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="20" width="40" height="5" rx="2.5" fill="#ffffff"/>
    <rect x="46" y="30" width="28" height="4" rx="2" fill="#34d399"/>
    <text x="46" y="46" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">SYNC LIVE</text>
  </g>

  <defs>
    <radialGradient id="erp_ambient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crate_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
</svg>
