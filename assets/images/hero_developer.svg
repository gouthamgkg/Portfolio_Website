  <!-- Star 2 -->
  <path class="twinkle-star star-del-1" d="M680 60 L681.5 66 L688 67.5 L681.5 69 L680 75 L678.5 69 L672 67.5 L678.5 66 Z" fill="#a5b4fc"/>
  <!-- Star 3 -->
  <path class="twinkle-star star-del-2" d="M740 180 L741 184 L745 185 L741 186 L740 190 L739 186 L735 185 L739 184 Z" fill="#fde047"/>
  <!-- Star 4 -->
  <path class="twinkle-star star-del-3" d="M220 50 L221 54 L225 55 L221 56 L220 60 L219 56 L215 55 L219 54 Z" fill="#34d399"/>
