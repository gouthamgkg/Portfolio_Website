<svg width="800" height="540" viewBox="0 0 800 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Keyframe Animations */
    .twinkle-star { animation: starPulse 2.4s ease-in-out infinite alternate; transform-origin: center; transform-box: fill-box; }
    .star-del-1 { animation-delay: 0.6s; }
    .star-del-2 { animation-delay: 1.2s; }
    .star-del-3 { animation-delay: 1.8s; }
    
    .float-slow { animation: floatSlow 5s ease-in-out infinite alternate; transform-origin: center; transform-box: fill-box; }
    .float-delay-1 { animation-delay: 1s; }
    .float-delay-2 { animation-delay: 2s; }
    
    .screen-glow { animation: screenPulse 4s ease-in-out infinite alternate; }
    .steam-anim { animation: steamRise 3s ease-out infinite; opacity: 0; }
    .steam-del { animation-delay: 1.5s; }
    .cursor-blink { animation: blinkCursor 1s step-end infinite; }
    .pulse-halo { animation: haloPulse 3s ease-in-out infinite alternate; }

    @keyframes starPulse {
      0% { opacity: 0.25; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }
    @keyframes screenPulse {
      0% { opacity: 0.85; filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.3)); }
      100% { opacity: 1; filter: drop-shadow(0 0 28px rgba(6, 182, 212, 0.5)); }
    }
    @keyframes steamRise {
      0% { transform: translateY(0) scaleX(0.8); opacity: 0; }
      40% { opacity: 0.6; }
      100% { transform: translateY(-16px) scaleX(1.3); opacity: 0; }
    }
    @keyframes blinkCursor {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    @keyframes haloPulse {
      0% { opacity: 0.35; transform: scale(0.96); }
      100% { opacity: 0.7; transform: scale(1.04); }
    }
  </style>

  <!-- Ambient Backdrop & Cybernetic Gradient Ring -->
  <g class="pulse-halo">
    <ellipse cx="440" cy="270" rx="340" ry="240" fill="url(#ambient_halo)" opacity="0.45"/>
    <circle cx="660" cy="140" r="160" fill="url(#cyan_halo)" opacity="0.25"/>
  </g>

  <!-- Perspective Isometric Grid Floor (Subtle Tech Atmosphere) -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="460" x2="720" y2="460"/>
    <line x1="120" y1="490" x2="680" y2="490"/>
    <line x1="160" y1="520" x2="640" y2="520"/>
    <line x1="160" y1="440" x2="280" y2="530"/>
    <line x1="320" y1="440" x2="400" y2="530"/>
    <line x1="480" y1="440" x2="480" y2="530"/>
    <line x1="640" y1="440" x2="560" y2="530"/>
