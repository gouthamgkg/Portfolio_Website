    <circle cx="25" cy="14" r="3" fill="#f59e0b"/>
    <circle cx="34" cy="14" r="3" fill="#10b981"/>
    
    <!-- Tab: Solution.cs -->
    <rect x="46" y="9" width="82" height="13" rx="2" fill="#0d1117"/>
    <text x="52" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600">FinTechEngine.cs</text>
    <text x="136" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="7">Ledger.sql</text>

    <!-- Code Editor Content -->
    <g transform="translate(14, 30)" font-family="'JetBrains Mono', monospace" font-size="6.5">
      <!-- Line 1: namespace -->
      <text y="0"><tspan fill="#c084fc">namespace</tspan> <tspan fill="#f8fafc">Elioenai.FinTechCore</tspan></text>
      <!-- Line 2: class declaration -->
      <text y="10"><tspan fill="#60a5fa">public class</tspan> <tspan fill="#34d399">ChittyAuctionEngine</tspan></text>
      <text y="19" fill="#94a3b8">{</text>
      <!-- Line 3: async method -->
      <text y="28" x="8"><tspan fill="#60a5fa">public async</tspan> <tspan fill="#34d399">Task</tspan>&lt;<tspan fill="#34d399">AuctionResult</tspan>&gt;</text>
      <!-- Line 4: Compute method -->
      <text y="37" x="16"><tspan fill="#f59e0b">CalculateDividendAsync</tspan>(<tspan fill="#38bdf8">int</tspan> chittyId)</text>
      <text y="46" x="8" fill="#94a3b8">{</text>
      <!-- Line 5: LINQ Query -->
      <text y="55" x="16"><tspan fill="#c084fc">var</tspan> subs = <tspan fill="#c084fc">await</tspan> _db.<tspan fill="#f59e0b">ChittySubscribers</tspan></text>
      <text y="64" x="24">.<tspan fill="#f59e0b">Where</tspan>(s =&gt; s.IsActive)</text>
      <text y="73" x="24">.<tspan fill="#f59e0b">OrderByDescending</tspan>(s =&gt; s.BidAmount)</text>
      <text y="82" x="24">.<tspan fill="#f59e0b">FirstOrDefaultAsync</tspan>();</text>
      <!-- Line 6: Return statement -->
      <text y="92" x="16"><tspan fill="#c084fc">return new</tspan> <tspan fill="#34d399">AuctionResult</tspan>(subs); <tspan class="cursor-blink" fill="#38bdf8">|</tspan></text>
      <text y="101" x="8" fill="#94a3b8">}</text>
      <text y="109" fill="#94a3b8">}</text>
    </g>

    <!-- IDE Status Bar -->
