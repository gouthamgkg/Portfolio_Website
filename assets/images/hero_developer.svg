  <!-- Ambient Circular Starlets -->
  <circle cx="160" cy="130" r="2.5" fill="#f8fafc" opacity="0.7"/>
  <circle cx="300" cy="45" r="2" fill="#93c5fd" opacity="0.6"/>
  <circle cx="610" cy="80" r="3" fill="#67e8f9" opacity="0.8"/>
  <circle cx="760" cy="270" r="2.5" fill="#c084fc" opacity="0.6"/>
  <circle cx="80" cy="310" r="2" fill="#a5b4fc" opacity="0.5"/>

  <!-- Holographic Floating Tech Badges -->
  <!-- Badge 1: ASP.NET Core -->
  <g class="float-slow" transform="translate(70, 110)">
    <rect width="130" height="34" rx="17" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" opacity="0.9" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))"/>
    <circle cx="20" cy="17" r="10" fill="#4f46e5"/>
    <path d="M16 20 L24 14 M16 14 L24 20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="36" y="21" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">.NET Core C#</text>
  </g>

