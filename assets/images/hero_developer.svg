    <circle cx="20" cy="17" r="10" fill="#0891b2"/>
    <!-- Database Icon -->
    <ellipse cx="20" cy="14" rx="6" ry="2.5" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <path d="M14 14 V19 C14 20.5 16.7 21.5 20 21.5 C23.3 21.5 26 20.5 26 19 V14" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <text x="36" y="21" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">SQL Server</text>
